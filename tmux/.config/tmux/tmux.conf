bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"
# ===========================================================
# PLUGINS
# ===========================================================

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# ===========================================================
# KEY BINDS
# ===========================================================

# setting Ctrl + q for prefix key
unbind C-b
set-option -g prefix C-q
bind-key C-q send-prefix

# split panes using "=" and "-"
bind '=' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Use Meta + arrows to switch between panes
bind-key -n M-Left select-pane -L
bind-key -n M-Right select-pane -R
bind-key -n M-Up select-pane -U
bind-key -n M-Down select-pane -D

# ===========================================================
# OPTIONS
# ===========================================================

# Enable mouse
set -g mouse on

# Stop renaming automatically
set-option -g allow-rename off

# ===========================================================
# DESIGN TWEAKS
# ===========================================================

# set 256 colors
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# clock mode
setw -g clock-mode-colour green

# copy mode
setw -g mode-style 'fg=black bg=blue bold'

# panes
set -g pane-border-style 'fg=blue'
set -g pane-active-border-style 'fg=green'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=blue'

set -g status-left ''
set -g status-left-length 10

set -g status-right-style 'fg=green bg=black'
set -g status-right '%Y-%m-%d %H:%M '
set -g status-right-length 50

setw -g window-status-current-style 'fg=black bg=blue'
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-style 'fg=blue bg=black'
setw -g window-status-format ' #I #[fg=white]#W #[fg=green]#F '

setw -g window-status-bell-style 'fg=green bg=blue bold'

# messages
set -g message-style 'fg=green bg=black'
