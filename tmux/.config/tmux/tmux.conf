bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"


# ===========================================================
# KEY BINDS
# ===========================================================

# setting Ctrl + q for prefix key
unbind C-b
set-option -g prefix C-q
bind-key C-q send-prefix

# split panes using "=" and "-"
bind '=' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Use Meta + arrows to switch between panes
bind-key -n M-Left select-pane -L
bind-key -n M-Right select-pane -R
bind-key -n M-Up select-pane -U
bind-key -n M-Down select-pane -D

# ===========================================================
# OPTIONS
# ===========================================================

# set 256 colors
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Enable mouse
set -g mouse on

# Stop renaming automatically
set-option -g allow-rename off

# Set base index as 1 and not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Use clipboard
set -g set-clipboard on

# Use vi motinons
setw -g mode-keys vi

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# copy mode
setw -g mode-style 'fg=black bg=blue bold'


# ===========================================================
# PLUGINS REGISTRATION (Must load before applying theme settings)
# ===========================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'omerxx/tmux-sessionx'


# ===========================================================
# CATPPUCCIN THEME CONFIGURATION (v2.x Syntax)
# ===========================================================
set -g @catppuccin_flavor "macchiato"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"

# Window zoom icon
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(),}"

# Configure Online
set -g @online_icon "ok"
set -g @offline_icon "nok"

# Custom Battery Module Settings
set -g @batt_icon_status_charging "⚡"
set -g @batt_icon_status_charged "✓"
set -g @batt_icon_status_discharging ""
set -g @batt_icon_status_attached ""

# Custom CPU and RAM icon
set -g @cpu_icon "󰍛"
set -g @ram_icon "󰘚"

# TMUX Feels Configuration
set -g status-position top
set -g status-style "bg=#{@thm_bg}"
set -g status-justify "absolute-centre"

# pane border look and feel
setw -g pane-border-status top
setw -g pane-border-format ""
setw -g pane-active-border-style "bg=#{@thm_bg},fg=#{@thm_overlay_0}"
setw -g pane-border-style "bg=#{@thm_bg},fg=#{@thm_surface_0}"
setw -g pane-border-lines single

# window look and feel
set -wg automatic-rename on
set -g automatic-rename-format "Window"

set -g window-status-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-style "bg=#{@thm_bg},fg=#{@thm_white}"
set -g window-status-last-style "bg=#{@thm_bg},fg=#{@thm_white}"
set -g window-status-activity-style "bg=#{@thm_green},fg=#{@thm_bg}"
set -g window-status-bell-style "bg=#{@thm_red},fg=#{@thm_bg},bold"
set -gF window-status-separator "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}]│"

set -g window-status-current-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-current-style "bg=#{@thm_peach},fg=#{@thm_bg},bold"

set -g status-position top
set -g status-style "bg=#{@thm_bg}"
set -g status-justify "absolute-centre"

# pane border look and feel
setw -g pane-border-status top
setw -g pane-border-format ""
setw -g pane-active-border-style "bg=#{@thm_bg},fg=#{@thm_overlay_0}"
setw -g pane-border-style "bg=#{@thm_bg},fg=#{@thm_surface_0}"
setw -g pane-border-lines single

# window look and feel
set -wg automatic-rename on
set -g automatic-rename-format "Window"

set -g window-status-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-style "bg=#{@thm_bg},fg=#{@thm_white}"
set -g window-status-last-style "bg=#{@thm_bg},fg=#{@thm_white},bold"
set -g window-status-activity-style "bg=#{@thm_red},fg=#{@thm_bg}"
set -g window-status-bell-style "bg=#{@thm_red},fg=#{@thm_bg},bold"
set -gF window-status-separator "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}]│"

set -g window-status-current-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-current-style "bg=#{@thm_teal},fg=#{@thm_bg},bold"

# ===========================================================
# STATUS LINE BUILDING (The v2.x Way)
# ===========================================================

# status left look and feel
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[bg=#{@thm_red},fg=#{@thm_bg},bold]  #S },#{#[bg=#{@thm_bg},fg=#{@thm_green}]  #S }}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_maroon}]  #{pane_current_command} "
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_blue}]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]#{?window_zoomed_flag,│,}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_yellow}]#{?window_zoomed_flag,  zoom ,}"

# status right look and feel
set -g status-right-length 150
set -g status-right ""
## CPU
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_peach}] #{@cpu_icon} #{cpu_percentage} "
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}]│"
## RAM
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_green}] #{@ram_icon} #{ram_percentage} "
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}]│"
## Battery
set -ga status-right "#{?#{e|>=:10,#{battery_percentage}},#{#[bg=#{@thm_red},fg=#{@thm_bg}]},#{#[bg=#{@thm_bg},fg=#{@thm_pink}]}} #{battery_icon} #{battery_percentage} "
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}]│"
## Online
set -ga status-right "#[bg=#{@thm_bg}]#{?#{==:#{online_status},ok},#[fg=#{@thm_mauve}]󰖩 on,#[fg=#{@thm_red},bold]󰖪 off}"
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}]│"
## Data/Hora
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_blue}]󰭦 %Y-%m-%d 󰅐 %H:%M "

# ===========================================================
# PLUGIN SPECIFIC CONFIGURATIONS
# ===========================================================

# Session x Settings
set -g @sessionx-bind 'o'
set -g @sessionx-fzf-builtin-tmux 'on'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'off'
set -g @sessionx-filter-current 'false'
set -g @sessionx-auto-accept 'off'

set -g @sessionx-custom-paths ""

set -g @sessionx-x-path "~/dotfiles"


# Resurrect & Continuum Restore settings
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialize TPM (Keep this at the very bottom)
run '~/.config/tmux/plugins/tpm/tpm'

